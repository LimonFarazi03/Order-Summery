<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <main class="container">
      <div class="mainHero">
        <img src="./images/illustration-hero.svg" alt="hero"/>
      </div>
      <div class="summery">
        <h2>Order Summery</h2>
        <p>
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
      </div>
      <div class="planSection">
        <div class="musicBtn">
          <img src="./images/icon-music.svg" alt="Music Icon" srcset="" />
          <div>
            <p>Anual Plan</p>
            <p>$59.99/year</p>
            <p></p>
          </div>
        </div>
        <p class="change">Change</p>
      </div>
      <div class="btn">
        <button class="btnProcess">Process To Payment</button>
        <button class="btnCancal">Cancal Order</button>
      </div>
    </main>
  </body>
</html>
